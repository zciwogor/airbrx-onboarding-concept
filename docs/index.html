<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Airbrx product docs</title>
<style>
  :root{
    --bg:#ffffff; --pane:#f6f7f9; --fg:#1b1d21; --muted:#5d6370; --line:#e1e4e8;
    --accent:#1f6feb; --accent-bg:#eaf2ff; --hi:#fff8e6;
    --out:#9a3412; --out-bg:#fdeee6; --ok:#166534; --ok-bg:#e6f4ea; --alt:#7a5a00; --alt-bg:#fbf1d6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --left:196px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/1.55 var(--sans);color:var(--fg);background:var(--bg)}
  a{color:var(--accent)}
  .top{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
  .top b{font-size:14px}
  .top .note{font-size:12px;color:var(--muted)}
  .top .menu{display:none;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px;font:inherit;font-size:13px}
  .wrap{display:flex;height:calc(100% - 44px)}
  /* left pane: a small repo tree */
  .left{width:var(--left);flex:0 0 var(--left);background:var(--pane);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;font-size:13px}
  .left .label{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 14px 4px}
  .left .repo{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 14px 8px}
  .left a.item{display:block;padding:5px 10px 5px 26px;color:var(--fg);text-decoration:none;font-family:var(--mono);font-size:11.5px;word-break:break-all;line-height:1.35;border-left:3px solid transparent;position:relative}
  .left a.item::before{content:"";position:absolute;left:12px;top:9px;width:8px;height:10px;border:1px solid var(--muted);border-radius:1px}
  .left a.item small{display:block;color:var(--muted);font-size:10.5px}
  .left a.item:hover{background:#eceff3}
  .left a.item.on{background:var(--accent-bg);border-left-color:var(--accent)}
  .left .folder{font-family:var(--mono);font-size:12px;padding:4px 14px;color:var(--fg)}
  .right{flex:1;overflow-y:auto}
  .doc{max-width:1120px;margin:0 auto;padding:20px 28px 64px}
  .dochead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
  .dochead h1{font-size:22px;line-height:1.25;margin:0;flex:1 1 360px}
  .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .meta code{font-family:var(--mono);font-size:11.5px;background:var(--pane);padding:1px 5px;border-radius:4px}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{font:600 12.5px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--pane)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  /* document body */
  .body h2{font-size:18px;margin:28px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
  .body h3{font-size:15.5px;margin:20px 0 6px}
  .body p{margin:8px 0}
  .body ul,.body ol{padding-left:22px;margin:8px 0}
  .body li p{margin:2px 0}
  .body blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--line);color:#33373f;background:var(--pane)}
  .body figure{margin:14px 0}
  .body figure img{max-width:100%;border:1px solid var(--line);border-radius:6px}
  .body figcaption{font-size:12px;color:var(--muted)}
  .body li[data-checked]{list-style:none;margin-left:-18px}
  .body code{font-family:var(--mono);font-size:.88em;background:var(--pane);padding:1px 4px;border-radius:4px}
  .tablewrap{overflow-x:auto;margin:10px 0}
  .body table{border-collapse:collapse;width:100%;font-size:var(--tfs,13px);line-height:1.38}
  .body th,.body td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
  .body th{background:var(--pane);font-weight:600}
  .body td p,.body th p{margin:0}
  .body thead th:empty{display:none}
  .badge{display:inline-block;font:600 10.5px var(--sans);letter-spacing:.02em;padding:1px 6px;border-radius:999px;vertical-align:1px}
  .badge.out{color:var(--out);background:var(--out-bg)}
  .badge.ok{color:var(--ok);background:var(--ok-bg)}
  .badge.alt{color:var(--alt);background:var(--alt-bg)}
  /* panels */
  .panel{border:1px solid var(--line);border-radius:8px;margin:28px 0 0;overflow:hidden}
  .panel h2{font-size:14px;margin:0;padding:10px 14px;background:var(--pane);border-bottom:1px solid var(--line)}
  .panel .inner{padding:10px 14px}
  .log{width:100%;border-collapse:collapse;font-size:13px}
  .log td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
  .log tr:first-child td{border-top:0}
  .log td.d{white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--muted);width:1%}
  .log td.v{white-space:nowrap;width:1%}
  .log td.v span{font-family:var(--mono);font-size:11.5px;background:var(--pane);padding:1px 6px;border-radius:4px}
  .log td.w{white-space:nowrap;width:1%;font-size:12.5px}
  .comment{border-top:1px solid var(--line);padding:8px 0}
  .comment:first-child{border-top:0}
  .comment .who{font-size:12.5px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px}
  form.cf{display:grid;gap:8px;margin-top:10px}
  form.cf .row{display:flex;gap:8px;flex-wrap:wrap}
  form.cf input,form.cf select,form.cf textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;flex:1 1 200px;min-width:0}
  form.cf textarea{min-height:90px;resize:vertical}
  form.cf .hint{font-size:12px;color:var(--muted)}
  .toast{position:fixed;bottom:16px;right:16px;background:#1b1d21;color:#fff;font-size:13px;padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:760px){
    .top .menu{display:inline-block}
    .left{position:fixed;top:44px;bottom:0;left:0;z-index:4;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 8px rgba(0,0,0,.08)}
    .left.open{transform:none}
    .doc{padding:16px 14px 48px}
    .top .note{display:none}
  }
  /* print / PDF: content only */
  body.print .top, body.print .left, body.print .actions, body.print .panel{display:none}
  body.print .wrap{display:block;height:auto}
  body.print .right{overflow:visible}
  body.print .doc{max-width:none;padding:0}
  @media print{
    .top,.left,.actions,.panel{display:none !important}
    .wrap{display:block;height:auto}
    .right{overflow:visible}
    .doc{max-width:none;padding:0}
    .body h2{break-after:avoid}
    .body tr,.body figure{break-inside:avoid}
    .tablewrap{overflow:visible}
  }
</style>
</head>
<body>
<div class="top">
  <button class="menu" id="menu" aria-label="Show documents">Docs</button>
  <b>Airbrx product docs</b>
  <span class="note">Drafts for the founders. Not for prospects.</span>
</div>
<div class="wrap">
  <nav class="left" id="left" aria-label="Documents"></nav>
  <main class="right" id="right"><div class="doc" id="doc"><p class="empty">Loading…</p></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  // Comments go to the doc owner by email. Assembled at runtime to keep the address out of plain text.
  const OWNER = ['a.rogowicz', 'gmail.com'].join('@');
  const params = new URLSearchParams(location.search);
  const PRINT = params.get('print');
  if (PRINT) document.body.classList.add('print');

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = d => { const [y,m,dd] = d.split('-').map(Number); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].at(m-1) + ' ' + dd + ', ' + y; };
  const nocache = '?v=' + Date.now();
  let manifest, revisions = [], comments = [];

  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

  // Shrink table text by column count so rows wrap as little as possible.
  function sizeTables(root){
    root.querySelectorAll('table').forEach(t => {
      if (!t.parentElement.classList.contains('tablewrap')) {
        const w = document.createElement('div'); w.className = 'tablewrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      }
      const row = t.querySelector('tr');
      const cols = row ? row.children.length : 1;
      const chars = t.textContent.length / Math.max(1, t.querySelectorAll('tr').length);
      let fs = cols <= 2 ? 13.5 : cols === 3 ? 13 : cols === 4 ? 12.5 : cols === 5 ? 12 : 11.5;
      if (chars > 260) fs -= 0.5;
      if (chars > 400) fs -= 0.5;
      t.style.setProperty('--tfs', fs + 'px');
      // Short cells (numbers, plan names) never wrap.
      t.querySelectorAll('td,th').forEach(c => { if (c.textContent.trim().length <= 14) c.style.whiteSpace = 'nowrap'; });
      // Wide tables: give the label column room so row names stay on one or two lines.
      if (cols >= 5) t.querySelectorAll('tr > :first-child').forEach(c => { c.style.minWidth = '15em'; });
    });
  }

  function renderLeft(active){
    const items = manifest.docs.map(d =>
      `<a class="item${d.id===active?' on':''}" href="#/${d.id}">${esc(d.file)}<small>${esc(d.version)} · ${fmt(d.updated)}</small></a>`).join('');
    $('#left').innerHTML =
      `<div class="label">Repo</div><div class="repo">zciwogor / airbrx-onboarding-concept</div>
       <div class="folder">docs/</div>${items}
       <a class="item${active==='log'?' on':''}" href="#/log">REVISIONS.log<small>${revisions.length} entries</small></a>`;
  }

  function logRows(list, showDoc){
    if (!list.length) return '<p class="empty">No revisions yet.</p>';
    const name = id => (manifest.docs.find(d => d.id === id) || {}).title || id;
    return '<table class="log">' + list.map(r =>
      `<tr><td class="d">${esc(r.date)}</td>${showDoc ? `<td class="w"><a href="#/${esc(r.doc)}">${esc(name(r.doc))}</a></td>` : ''}<td class="v"><span>${esc(r.version)}</span></td><td>${esc(r.summary)}</td></tr>`).join('') + '</table>';
  }

  function commentBlock(d){
    const list = comments.filter(c => c.doc === d.id);
    const shown = list.length ? list.map(c => `<div class="comment"><div class="who">${esc(c.name)} · ${esc(c.date)}${c.section ? ' · ' + esc(c.section) : ''}</div><div>${esc(c.text)}</div></div>`).join('')
                              : '<p class="empty">No comments posted yet.</p>';
    const heads = [...document.querySelectorAll('.body h2')].map(h => h.textContent.trim());
    return `<section class="panel" id="comments"><h2>Comments</h2><div class="inner">${shown}
      <form class="cf" id="cf">
        <div class="row"><input id="cf-name" placeholder="Your name" required><select id="cf-sec"><option value="">Whole document</option>${heads.map(h => `<option>${esc(h)}</option>`).join('')}</select></div>
        <textarea id="cf-text" placeholder="Your comment" required></textarea>
        <div class="row" style="align-items:center"><button class="btn primary" type="submit">Send comment</button><button class="btn" type="button" id="cf-copy">Copy instead</button>
        <span class="hint">No sign-in. Opens an email to Adam with the doc, version and section filled in. Comments are posted here after review.</span></div>
      </form></div></section>`;
  }

  function wireComments(d){
    const body = () => {
      const name = $('#cf-name').value.trim(), sec = $('#cf-sec').value, text = $('#cf-text').value.trim();
      return { name, sec, text, full: `Doc: ${d.title} (${d.version}, ${d.updated})\nSection: ${sec || 'Whole document'}\nFrom: ${name}\n\n${text}\n\nLink: ${location.href.split('#')[0]}#/${d.id}` };
    };
    $('#cf').addEventListener('submit', e => {
      e.preventDefault();
      const b = body(); if (!b.name || !b.text) return;
      const subj = `[Airbrx docs] ${d.title} ${d.version}${b.sec ? ' · ' + b.sec : ''}`;
      location.href = `mailto:${OWNER}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(b.full)}`;
      toast('Opening your email app');
    });
    $('#cf-copy').addEventListener('click', async () => {
      const b = body(); if (!b.text) { toast('Write a comment first'); return; }
      try { await navigator.clipboard.writeText(b.full + `\n\nSend to: ${OWNER}`); toast('Copied. Paste it into an email or text to Adam.'); }
      catch { toast('Copy failed. Select the text and copy it.'); }
    });
  }

  async function showDoc(id){
    const d = manifest.docs.find(x => x.id === id) || manifest.docs[0];
    renderLeft(d.id);
    const html = await fetch(d.content + nocache).then(r => r.text());
    const revs = revisions.filter(r => r.doc === d.id);
    $('#doc').innerHTML =
      `<div class="dochead"><div style="flex:1 1 360px"><h1>${esc(d.title)}</h1>
         <div class="meta">${esc(d.status)} · <code>${esc(d.version)}</code> · updated ${fmt(d.updated)} · ${esc(manifest.owner)}</div></div>
         <div class="actions"><a class="btn primary" href="${esc(d.pdf)}" download>Download PDF</a>
         <button class="btn" id="print">Print</button><a class="btn" href="#comments" data-local>Comment</a><a class="btn" href="#history" data-local>History</a></div></div>
       <article class="body" id="body">${html}</article>
       <section class="panel" id="history"><h2>Revision history</h2><div class="inner">${logRows(revs, false)}</div></section>`;
    $('#doc').insertAdjacentHTML('beforeend', commentBlock(d));
    sizeTables($('#body'));
    $('#print').addEventListener('click', () => window.print());
    wireComments(d);
    document.title = d.title + ' · Airbrx product docs';
    $('#right').scrollTop = 0;
    $('#left').classList.remove('open');
  }

  function showLog(){
    renderLeft('log');
    $('#doc').innerHTML = `<div class="dochead"><div><h1>Revision log</h1><div class="meta">Every change to these docs, newest first. Source of truth for versions.</div></div></div>
      <div class="body">${logRows(revisions, true)}</div>`;
    document.title = 'Revision log · Airbrx product docs';
    $('#left').classList.remove('open');
  }

  function route(){
    const h = location.hash;
    if (h.startsWith('#/')) { const id = h.slice(2); id === 'log' ? showLog() : showDoc(id); }
    else if (!h) showDoc(manifest.docs[0].id);
  }

  // In-page anchors (section links, Comment, History) scroll inside the right pane without changing the route.
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href.startsWith('#/')) return;
    e.preventDefault();
    const el = document.getElementById(decodeURIComponent(href.slice(1)));
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  $('#menu').addEventListener('click', () => $('#left').classList.toggle('open'));
  window.addEventListener('hashchange', route);

  Promise.all([
    fetch('manifest.json' + nocache).then(r => r.json()),
    fetch('revisions.json' + nocache).then(r => r.json()).catch(() => []),
    fetch('comments.json' + nocache).then(r => r.json()).catch(() => [])
  ]).then(([m, r, c]) => {
    manifest = m; revisions = r.sort((a,b) => b.date.localeCompare(a.date)); comments = c;
    if (PRINT) { showDoc(PRINT).then(() => document.body.setAttribute('data-ready','1')); return; }
    route();
  });
})();
</script>
</body>
</html>
